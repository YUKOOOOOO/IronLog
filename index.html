<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0D0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<meta name="description" content="本地优先的极简健身追踪与 AI 教练">
<title>IronLog · 极简健身追踪 完整版</title>
<!-- IronLog 完整版：单文件、零依赖、双击即用、纯本地存储。
     同一份代码同时用于浏览器 / PWA 与 Android WebView 壳（特性检测自动适配）；
     同目录的 manifest.webmanifest / sw.js / icons 可提供 PWA 安装能力。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ============================================================
   IronLog · Design tokens & base
   ============================================================ */
:root{
  --bg:#0D0F12; --card:#181B20; --card2:#1E2229; --card3:#242932;
  --line:#2A3038; --line2:#353D47;
  --txt:#EDF1F5; --dim:#929BA8; --muted:#5F6875;
  --acc:#10B981; --acc-dim:#0B7F5B; --acc-soft:rgba(16,185,129,.13);
  --blue:#3B82F6; --blue-soft:rgba(59,130,246,.14);
  --warn:#F5A524; --danger:#F0585B; --purple:#A78BFA;
  --r:18px; --r2:13px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07090B;color:var(--txt)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;touch-action:manipulation;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.6)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}
svg{display:block;flex:none}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;padding:calc(var(--sat) + 14px) 16px 11px;
  background:rgba(13,15,18,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.045)}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:750;letter-spacing:-.3px}
.brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--acc),#0E7C94);
  display:grid;place-items:center;color:#04120D;box-shadow:0 4px 16px rgba(16,185,129,.28)}
.brand .logo .ic{width:17px;height:17px;stroke-width:2.4}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.6px;margin-top:-2px}
.top-badge{font-size:11px;color:var(--dim);background:var(--card2);border:1px solid var(--line);
  padding:5px 9px;border-radius:20px;display:flex;align-items:center;gap:5px}
.top-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
#view{padding:14px 14px calc(100px + var(--sab));min-height:70vh}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card.tight{padding:12px}
.card.flat{background:var(--card2);border-color:transparent}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;gap:8px}
.sec-title h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.3px;color:var(--dim);display:flex;align-items:center;gap:7px}
.sec-title .ic{width:15px;height:15px}
.sec-title .hint{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .acc{color:var(--acc)} .blue{color:var(--blue)}
.warn{color:var(--warn)} .danger{color:var(--danger)} .purple{color:var(--purple)}
.t-xs{font-size:11px} .t-sm{font-size:12px} .t-lg{font-size:17px} .t-xl{font-size:25px;font-weight:800;letter-spacing:-1px}
.bold{font-weight:700} .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:12px -15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:650;padding:3px 8px;border-radius:20px;
  background:var(--card3);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.pill.green{background:var(--acc-soft);color:var(--acc);border-color:rgba(16,185,129,.28)}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(59,130,246,.28)}
.pill.warn{background:rgba(245,165,36,.12);color:var(--warn);border-color:rgba(245,165,36,.25)}
.pill.red{background:rgba(240,88,91,.12);color:var(--danger);border-color:rgba(240,88,91,.25)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;padding:0 12px;border-radius:11px;
  background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap;transition:.16s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--acc-soft);border-color:rgba(16,185,129,.45);color:var(--acc)}
.chip.on.blue{background:var(--blue-soft);border-color:rgba(59,130,246,.45);color:var(--blue)}
.chip.sm{min-height:28px;padding:0 9px;font-size:11px;border-radius:9px}
.btn{min-height:42px;padding:0 15px;border-radius:12px;background:var(--card3);border:1px solid var(--line);
  color:var(--txt);font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.16s}
.btn:active{transform:scale(.975)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,var(--acc),#0AA47C);color:#04140E;border-color:transparent;box-shadow:0 6px 20px rgba(16,185,129,.22)}
.btn.blue{background:linear-gradient(135deg,var(--blue),#5B6EF5);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(240,88,91,.1);color:var(--danger);border-color:rgba(240,88,91,.25)}
.btn.block{width:100%}
.btn.sm{min-height:32px;font-size:11.5px;padding:0 11px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg>button{flex:1;min-height:32px;border-radius:9px;font-size:12px;font-weight:650;color:var(--dim);transition:.16s}
.seg>button.on{background:var(--card3);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg>button.on.acc{background:var(--acc-soft);color:var(--acc)}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;min-height:42px;padding:10px 12px;font-size:13px;color:var(--txt)}
.field:focus{border-color:var(--acc)}
select.field{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23929BA8' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:34px}
label.lbl{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px;font-weight:600;letter-spacing:.3px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat-grid.four{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 10px}
.stat .k{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.stat .v small{font-size:10px;font-weight:600;color:var(--dim);margin-left:2px}
.bar{height:6px;border-radius:6px;background:var(--card3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),#4ADE80);transition:width .4s}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:12px}
.empty .ic{width:34px;height:34px;margin:0 auto 10px;opacity:.45}

/* ---------- rotation strip ---------- */
.nodes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -2px;scrollbar-width:none}
.node{min-width:88px;flex:1;padding:11px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  text-align:left;position:relative;overflow:hidden;transition:.18s}
.node:active{transform:scale(.97)}
.node .nname{font-size:13px;font-weight:750;display:flex;align-items:center;gap:5px}
.node .nsub{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.on{border-color:var(--acc);background:linear-gradient(160deg,rgba(16,185,129,.16),rgba(16,185,129,.04))}
.node.on:after{content:"";position:absolute;right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:rgba(16,185,129,.16)}
.node .tick{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ---------- exercise card ---------- */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.ex.done-all{border-color:rgba(16,185,129,.35)}
.ex-head{display:flex;align-items:center;gap:10px;padding:13px 13px 11px}
.ex-idx{width:26px;height:26px;border-radius:9px;background:var(--card3);display:grid;place-items:center;
  font-size:11px;font-weight:800;color:var(--dim);flex:none}
.ex.done-all .ex-idx{background:var(--acc-soft);color:var(--acc)}
.ex-name{font-size:14px;font-weight:700;letter-spacing:-.1px}
.ex-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex-body{border-top:1px solid var(--line);padding:9px 11px 11px}
.sethead{display:grid;grid-template-columns:24px 88px 88px 36px 20px;gap:6px;align-items:center;
  font-size:10px;color:var(--muted);padding:0 2px 6px;font-weight:650}
.setrow{display:grid;grid-template-columns:24px 88px 88px 36px 20px;gap:6px;align-items:center;
  padding:5px 2px;border-radius:10px;position:relative;transition:transform .18s;background:transparent}
.setrow+.setrow{border-top:1px solid rgba(255,255,255,.035)}
.setrow.swiped{transform:translateX(-46px)}
.setrow.done{background:rgba(16,185,129,.055)}
.setrow .del{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:36px;height:30px;border-radius:9px;
  background:rgba(240,88,91,.2);color:var(--danger);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s}
.setrow.swiped .del{opacity:1;pointer-events:auto}
.setrow .del .ic{width:14px;height:14px}
.tagbtn{width:24px;height:28px;border-radius:8px;background:var(--card3);border:1px solid var(--line);
  font-size:10px;font-weight:800;color:var(--dim);display:grid;place-items:center}
.tagbtn.W{color:var(--warn);border-color:rgba(245,165,36,.35);background:rgba(245,165,36,.1)}
.tagbtn.D{color:var(--purple);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.1)}
.tagbtn.F{color:var(--danger);border-color:rgba(240,88,91,.35);background:rgba(240,88,91,.1)}
.tagbtn.N{color:var(--blue);border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:9px;height:30px;overflow:hidden}
.step button{width:25px;height:100%;display:grid;place-items:center;color:var(--dim);flex:none}
.step button:active{background:var(--card3);color:var(--acc)}
.step button .ic{width:12px;height:12px;stroke-width:2.6}
.step .val{flex:1;text-align:center;font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.step .val.ghost{color:var(--muted);font-weight:600}
.check{width:34px;height:30px;border-radius:9px;background:var(--card3);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted)}
.check .ic{width:16px;height:16px;stroke-width:2.5}
.check.on{background:var(--acc);border-color:var(--acc);color:#04140E;box-shadow:0 3px 12px rgba(16,185,129,.3)}
.xbtn{width:20px;height:28px;display:grid;place-items:center;color:var(--muted)}
.xbtn .ic{width:12px;height:12px}
.ex-foot{display:flex;gap:7px;padding:2px 11px 12px}
.ghost-line{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin:0 2px 7px}
.ghost-line .ic{width:12px;height:12px}

/* ---------- big finish button ---------- */
.finish{width:100%;min-height:56px;border-radius:17px;color:#04140E;font-size:15px;font-weight:800;letter-spacing:.2px;
  background:linear-gradient(100deg,#10B981,#34D399 45%,#3B82F6);display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 30px rgba(16,185,129,.24);position:relative;overflow:hidden;margin-top:6px}
.finish:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
@keyframes sh{0%{left:-60%}55%,100%{left:130%}}
.finish:active{transform:scale(.985)}
.finish .ic{width:19px;height:19px;stroke-width:2.4}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + var(--sab));
  background:rgba(18,21,25,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:10px;font-weight:650;transition:.16s}
.tabbar button .ic{width:21px;height:21px;stroke-width:1.9}
.tabbar button.on{color:var(--acc)}
.tabbar button.on .ic{filter:drop-shadow(0 0 8px rgba(16,185,129,.5))}

/* ---------- rest timer · v1.1 大尺寸醒目提醒 ---------- */
#rest{position:fixed;top:calc(var(--sat) + 58px);left:50%;transform:translateX(-50%);width:calc(100% - 22px);max-width:458px;z-index:45;
  border-radius:20px;padding:14px 15px 13px;overflow:hidden;
  background:linear-gradient(135deg,rgba(11,42,33,.98),rgba(9,28,34,.98) 58%,rgba(13,24,38,.98));
  border:1.5px solid rgba(16,185,129,.55);
  box-shadow:0 18px 52px rgba(0,0,0,.72),0 0 0 1px rgba(16,185,129,.08),inset 0 0 36px rgba(16,185,129,.2);
  animation:restin .32s cubic-bezier(.2,.9,.3,1)}
#rest:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -25%,rgba(16,185,129,.2),transparent 70%)}
@keyframes restin{from{opacity:0;transform:translate(-50%,-20px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.rest-top{display:flex;align-items:center;gap:14px;position:relative}
.rest-ring{position:relative;width:76px;height:76px;flex:none}
.rest-ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.rest-ring .rc-bg{stroke:rgba(255,255,255,.09)}
.rest-ring .rc-fg{stroke:url(#restGrad);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.rest-ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:850;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;text-shadow:0 0 14px rgba(16,185,129,.85)}
.rest-ring.emoji .rt{font-size:34px}
.rest-main{flex:1;min-width:0}
.rest-kicker{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--acc);display:flex;align-items:center;gap:6px}
.rest-kicker .pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.rest-num{font-size:40px;line-height:1.08;font-weight:850;letter-spacing:-2px;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(16,185,129,.5)}
.rest-num.txt{font-size:26px;letter-spacing:-.6px}
.rest-sub{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5}
.rest-btns{display:flex;gap:7px;margin-top:12px;position:relative}
.rest-btns button{flex:1;min-height:42px;border-radius:11px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);font-size:12.5px;font-weight:750;color:var(--txt);display:grid;place-items:center}
.rest-btns button:active{transform:scale(.96)}
.rest-btns button.primary{background:linear-gradient(135deg,var(--acc),#0AA47C);color:#04140E;border-color:transparent}
.rest-btns button.skip{color:var(--muted)}
#rest.due{border-color:rgba(245,165,36,.7);animation:dueflash .6s ease-in-out 4}
#rest.due .rest-num{color:var(--warn);text-shadow:0 0 24px rgba(245,165,36,.7)}
#rest.due .rest-kicker{color:var(--warn)}
#rest.due .rest-ring .rc-fg{stroke:var(--warn)}
@keyframes dueflash{0%,100%{box-shadow:0 18px 52px rgba(0,0,0,.72),0 0 0 1px rgba(245,165,36,.2)}
  50%{box-shadow:0 18px 62px rgba(0,0,0,.8),0 0 0 3px rgba(245,165,36,.55),0 0 46px rgba(245,165,36,.35)}}

/* ---------- sheet / modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;backdrop-filter:blur(3px);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:51;
  background:#15181D;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  max-height:86vh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{margin:0;font-size:15px;font-weight:750}
.sheet-b{padding:14px 16px calc(20px + var(--sab));overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-grab{width:36px;height:4px;border-radius:4px;background:var(--line2);margin:8px auto 0}
.iconbtn{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;color:var(--dim)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:60;
  background:#EDF1F5;color:#101317;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,-6px)}

/* ---------- equipment grid ---------- */
.eq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.eq{display:flex;align-items:center;gap:9px;padding:10px;border-radius:13px;background:var(--card2);border:1px solid var(--line);transition:.16s}
.eq.on{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.075)}
.eq .eico{width:30px;height:30px;border-radius:9px;background:var(--card3);display:grid;place-items:center;color:var(--dim);flex:none}
.eq.on .eico{background:var(--acc-soft);color:var(--acc)}
.eq .eico .ic{width:16px;height:16px}
.eq .en{display:block;font-size:11.5px;font-weight:650;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .es{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:32px;height:19px;border-radius:12px;background:var(--card3);border:1px solid var(--line2);position:relative;flex:none;transition:.18s}

.eq.on .sw{background:var(--acc);border-color:var(--acc)}

/* ---------- analytics ---------- */
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.cal i{width:12px;height:12px;border-radius:3px;background:var(--card3);display:block}
.cal i.l1{background:rgba(16,185,129,.28)} .cal i.l2{background:rgba(16,185,129,.5)}
.cal i.l3{background:rgba(16,185,129,.75)} .cal i.l4{background:#10B981;box-shadow:0 0 8px rgba(16,185,129,.5)}
.bodywrap{display:flex;gap:8px;justify-content:center}
.bodywrap svg{width:47%;height:auto;max-width:170px}
.rec{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.rec:last-child{border-bottom:0}
.rec .rn{width:66px;font-size:11.5px;font-weight:650;flex:none}
.rec .rb{flex:1}
.rec .rv{width:40px;text-align:right;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.trend{width:100%;height:130px;display:block}
.legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- AI ---------- */
.ai-hero{border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(59,130,246,.22),transparent 55%),linear-gradient(140deg,#182026,#181B20);
  border:1px solid var(--line)}
.ai-hero:after{content:"";position:absolute;right:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.14),transparent 70%)}
.md{font-size:12.5px;line-height:1.75;color:var(--dim);white-space:pre-wrap;word-break:break-word}
.md b,.md strong{color:var(--txt)}
.md .hl{color:var(--acc);font-weight:700}
.rx{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.rx .rxi{width:27px;height:27px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none;font-size:11px;font-weight:800}
.rx .rxr{font-size:11px;font-weight:750;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.rx .rxwhy{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
pre.json{background:#0B0E11;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:10px;
  color:#8AA0B4;overflow:auto;max-height:170px;margin:0;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- v1.1 增强：折叠 / 全动作库 / 分析范围 / 删除 / 线条热力图 ---------- */
.ex-head{cursor:pointer;user-select:none;transition:background .15s}
.ex-head:active{background:rgba(255,255,255,.025)}
.ex .chev{display:block;transition:transform .22s}
.ex.collapsed .chev{transform:rotate(-90deg)}
.ex-sum{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:10.5px;color:var(--muted)}
.ex-sum .mini{width:56px;height:4px;border-radius:4px;background:var(--card3);overflow:hidden;flex:none}
.ex-sum .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#4ADE80);border-radius:4px}
.ex-sum .ok{color:var(--acc);font-weight:700}
.sheet-scope{display:flex;gap:5px;margin-bottom:11px}
.sheet-scope button{flex:1;min-height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:11.5px;font-weight:700;color:var(--dim);line-height:1.25}
.sheet-scope button.on{background:var(--acc-soft);border-color:rgba(16,185,129,.45);color:var(--acc)}
.sheet-search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;min-height:38px;
  padding:8px 12px;font-size:12.5px;color:var(--txt);margin-bottom:10px}
.sheet-search:focus{border-color:var(--acc)}
.list-item .eqflag{font-size:9.5px;color:var(--warn);font-weight:650}
.scope-card{border-color:rgba(59,130,246,.28);background:linear-gradient(150deg,rgba(59,130,246,.07),var(--card) 55%)}
.scope-card .field{min-height:38px;padding:7px 10px;font-size:12px}
.scope-card input[type=date]{color-scheme:dark}
.scope-note{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.del-ses{min-width:30px;height:30px;border-radius:9px;background:rgba(240,88,91,.09);
  border:1px solid rgba(240,88,91,.2);color:var(--danger);display:grid;place-items:center;flex:none}
.del-ses .ic{width:14px;height:14px}
.bodywrap svg{width:48%;height:auto;max-width:184px}
.body-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.55}

/* ---------- v1.2 训练模板 / 简明 AI 建议 ---------- */
.tpl-top{border:1px solid rgba(16,185,129,.24);border-radius:14px;padding:13px;margin-bottom:13px;
  background:linear-gradient(150deg,rgba(16,185,129,.09),var(--card) 65%)}
.tpl-card{border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:12px;margin-bottom:10px}
.tpl-card .del-ses{min-width:28px;height:28px}
.del-ses.tpl-save{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.26);color:var(--blue)}
.tpl-row{border-top:1px dashed var(--line);margin-top:10px;padding-top:9px}
.ai-block{border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:11px 12px;margin-top:10px}
.ai-block.plan{border-color:rgba(59,130,246,.32);background:linear-gradient(150deg,rgba(59,130,246,.09),var(--card2) 70%)}
.ai-block-t{font-size:11.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;margin-bottom:7px}
.ai-block.plan .ai-block-t{color:var(--blue)}
.ai-block .li{font-size:11.5px;color:var(--dim);line-height:1.65;padding:3px 0}
.ai-block .li b{color:var(--txt)}
.ai-block .plan-txt{font-size:11.5px;color:var(--dim);line-height:1.75}
#tplDate,.scope-card input[type=date]{color-scheme:dark}

/* ============================================================
   v1.3 · 手机浏览器 App 化适配（排版 / 触控 / 手势观感）
   ============================================================ */
:root{--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{min-height:100%;overflow-x:hidden}
/* overflow:hidden 会创建滚动容器，令 .top 的 sticky 失效；clip 不会 */
#app{overflow:hidden;overflow:clip;min-height:100vh;min-height:100dvh}
.top{padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar));
  transition:box-shadow .2s,border-color .2s}
.top.scrolled{box-shadow:0 8px 26px rgba(0,0,0,.5);border-bottom-color:rgba(255,255,255,.09)}
#view{padding-left:calc(14px + var(--sal));padding-right:calc(14px + var(--sar));
  padding-bottom:calc(86px + var(--sab));min-height:70vh;min-height:70dvh}
.tabbar{padding-left:calc(6px + var(--sal));padding-right:calc(6px + var(--sar))}
.tabbar button{position:relative}
.tabbar button.on:before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px rgba(16,185,129,.6)}
#sheet{max-height:86vh;max-height:86dvh;overscroll-behavior:contain}
.sheet-b{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.nodes,.cal{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
button,.top,.tabbar,.node,.chip,.list-item,.ex-head,.sheet-h,.sheet-grab{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@keyframes viewfade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
#view.fadein{animation:viewfade .2s ease-out}

/* 组行改弹性列：任何屏宽都不再横向溢出（原固定 88px+88px 在窄屏必爆） */
.sethead,.setrow{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 38px 22px;gap:5px}
.step .val{min-width:0;overflow:hidden;text-overflow:ellipsis}

@media (pointer:coarse),(max-width:560px){
  /* 1) 所有输入框 >=16px，避免 iOS Safari 聚焦时整页缩放 */
  #view input,#view select,#view textarea,#sheet input,#sheet select,#sheet textarea{font-size:16px}
  .field,.sheet-search{min-height:46px;font-size:16px}

  .rest-btns button{min-height:48px}
  .tabbar button{min-height:58px;padding:8px 0;gap:4px}
  .del-ses,.tpl-card .del-ses{min-width:40px;height:40px}
  .list-item{padding:13px 0}
  .eq{padding:13px 10px}
  .ex-head{padding:15px 12px}
  .ex-foot{padding-bottom:14px}
  .finish{min-height:62px}
  .node{padding:13px 10px}
  .sheet-grab{width:44px;height:5px;margin-top:10px}
  .sheet-h{padding:12px 16px}
  .sheet-b{padding-bottom:calc(24px + var(--sab))}
  .tagbtn,.check,.xbtn{height:40px}
  .setrow .del{height:38px}
  /* 3) 组行：弹性列 + 外扩点击热区（视觉尺寸不变形） */
  .sethead,.setrow{grid-template-columns:
    clamp(24px,8vw,30px) minmax(0,1fr) minmax(0,1fr) clamp(34px,11vw,42px) clamp(22px,7vw,26px);gap:5px}
  .setrow{padding-top:6px;padding-bottom:6px}

  .step button{width:clamp(24px,8vw,30px);position:relative}

  .tagbtn:after{content:"";position:absolute;inset:-2px -6px}

  .xbtn:after{content:"";position:absolute;inset:-4px -8px}
  .setrow .del{width:40px;right:-44px}
  .setrow.swiped{transform:translateX(-50px)}
  /* 4) 点击反馈更接近原生 */
  button:active{opacity:.74}
  .list-item:active{background:rgba(255,255,255,.035)}
}
@media (pointer:coarse) and (max-width:560px){
  .md{font-size:13px;line-height:1.8}

  .ex-meta{font-size:11px}

  .step button:after{inset:-4px -8px}

}
@media (min-width:600px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

const Native=(function(){
  var N=(typeof window!=='undefined'&&window.IronNative)?window.IronNative:null;
  var pending={},seq=0;
  function dec(b64){
    if(!b64)return '';

      var s=atob(b64),u=new Uint8Array(s.length);

    return new Promise(function(res,rej){
      if(!N)return rej(new Error('no-native'));
      var id='n'+(++seq);pending[id]={res:res,rej:rej};
      try{N[method].apply(N,args.concat([id]));}

    on:!!N,

  };
  if(api.on){
    try{Object.defineProperty(navigator,'vibrate',{configurable:true,value:function(p){return api.vib(p);}});}catch(e){}
  }
  return api;
})();

const DB_KEY='ironlog.v1';
const Store={
  data:null, memOnly:false,
  defaults:function(){
    return {
      version:1, createdAt:Date.now(),
      settings:{
        split:'ppl',customCycle:['push','pull','legs'],cursor:0,profile:'home',
        equipment:{dumbbell:true,barbell:false,hack:false,cable:false,machines:false,bands:true,bodyweight:true,rower:false,treadmill:false,bike:false},
        rest:90,restOn:true,bodyweight:70,notify:false,
        ai:{baseUrl:'https://api.deepseek.com',model:'deepseek-chat',cipher:'',demo:true}
      },
      customExercises:[],sessions:seedSessions(),today:null,
      aiCache:{review:null,prescription:null},avoid:[],templates:[]
    };
  },
  load:function(){
    try{
      var raw=localStorage.getItem(DB_KEY);
      if(raw){this.data=JSON.parse(raw);}
      else{this.data=this.defaults();}
    }catch(e){console.warn('storage unavailable',e);this.memOnly=true;this.data=this.defaults();}
    // 兼容性补全
    var d=this.defaults();
    for(var k in d){if(this.data[k]===undefined)this.data[k]=d[k];}
    for(var s in d.settings){if(this.data.settings[s]===undefined)this.data.settings[s]=d.settings[s];}
    for(var a in d.settings.ai){if(this.data.settings.ai[a]===undefined)this.data.settings.ai[a]=d.settings.ai[a];}
    if(!this.data.aiCache)this.data.aiCache={review:null,prescription:null};
    if(!this.data.avoid)this.data.avoid=[];
    if(!Array.isArray(this.data.templates))this.data.templates=[];
    return this.data;
  },
  save:function(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}
    catch(e){this.memOnly=true;console.warn('save failed',e);}
  },
  reset:function(){this.data=this.defaults();this.save();},
  /* 用 WebCrypto 生成不可导出的 AES-GCM 密钥并存于 IndexedDB，密文才进 localStorage */
  _db:function(){return new Promise(function(res,rej){
    try{var q=indexedDB.open('ironlog-crypto',1);
      q.onupgradeneeded=function(){q.result.createObjectStore('keys');};
      q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};
    }catch(e){rej(e);}
  });},
  _key:function(){var self=this;return self._db().then(function(db){return new Promise(function(res,rej){
    var g=db.transaction('keys','readonly').objectStore('keys').get('ai');
    g.onsuccess=function(){
      if(g.result)return res(g.result);
      if(!window.crypto||!crypto.subtle)return rej(new Error('no subtle'));
      crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']).then(function(k){
        var tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(k,'ai');
        tx.oncomplete=function(){res(k);};tx.onerror=function(){rej(tx.error);};
      },rej);
    };g.onerror=function(){rej(g.error);};
  });});},
  encrypt:function(txt){var self=this;if(!txt)return Promise.resolve('');
    if(!window.crypto||!crypto.subtle)return Promise.resolve('ob:'+btoa(unescape(encodeURIComponent(xor(txt)))));
    return self._key().then(function(k){
      var iv=crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(txt)).then(function(ct){

        else{why='上次 '+Number(w)+'kg × '+Number(r)+' 次未达次数上限，本周先冲次数（+1~2 次）';}
      }
      return {name:e.name,muscle:e.muscle,equipment:e.eq,sets:timeCrunch?2:(sore?2:3),reps:targetR,

    if(lowback)notes.push('腰部避让：已移除硬拉/俯身划船，改用坐姿器械与绳索支撑位');
    if(shoulder)notes.push('肩部避让：已移除过顶推举与上斜卧推，减少肩峰下撞击');
    if(sleep||sore)notes.push('恢复优先：整体负荷下调，RPE 控制在 7 以内');

  /* ---------- DeepSeek / OpenAI 兼容接口 ---------- */
  hasKey:function(){return !!Runtime.keyPlain&&!this.S().settings.ai.demo;},
  callAI:function(messages,jsonMode){
    var cfg=this.S().settings.ai;
    var url=String(cfg.baseUrl||'https://api.deepseek.com').replace(/\/+$/,'');
    if(!/\/chat\/completions$/.test(url))url+='/chat/completions';
    var body={model:cfg.model||'deepseek-chat',messages:messages,temperature:0.4,max_tokens:900};
    if(jsonMode&&cfg.model!=='deepseek-reasoner')body.response_format={type:'json_object'};
    /* 原生容器：走 Java 层 HTTP，无同源策略限制，DeepSeek / 中转 / 局域网 http 均可直连 */
    if(Native.on)return Native.post(url,Runtime.keyPlain,JSON.stringify(body)).then(function(r){
      if(r.status<200||r.status>=300)throw new Error('HTTP '+r.status+' · '+r.text.slice(0,180));
      var j;try{j=JSON.parse(r.text);}catch(e){throw new Error('接口未返回 JSON：'+r.text.slice(0,120));}
      var m=j.choices&&j.choices[0]&&j.choices[0].message;
      if(!m)throw new Error('接口未返回 message');
      return m.content||m.reasoning_content||'';
    });
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+Runtime.keyPlain},
      body:JSON.stringify(body)}).then(function(r){
        if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' · '+t.slice(0,180));});
        return r.json();
      }).then(function(j){
        var m=j.choices&&j.choices[0]&&j.choices[0].message;
        if(!m)throw new Error('接口未返回 message');
        return m.content||m.reasoning_content||'';
      }).catch(function(e){
        if(e instanceof TypeError)throw new Error('网络/CORS 拦截：浏览器无法直连该接口，请改用支持 CORS 的中转或本地模型（Ollama / LM Studio）');
        throw e;
      });
  },
  parseJSON:function(txt){

    var a=t.indexOf('{'),b=t.lastIndexOf('}');
    if(a<0||b<a)throw new Error('AI 未返回 JSON 结构');
    try{return JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('JSON 解析失败：'+e.message);}
  },

  /* ---------- 导入归一化（兼容 IronLog / OpenGym / Strong / Hevy 基础字段） ---------- */
  normalizeImport:function(obj){
    var self=this,out=[];
    function setsOf(e){
      var raw=e.sets||e.setList||[];
      if(!Array.isArray(raw))return [];
      return raw.map(function(s){
        var a=Number(s.a!=null?s.a:(s.weight_kg!=null?s.weight_kg:(s.weight!=null?s.weight:(s.kg||0))))||0;
        var b=Number(s.b!=null?s.b:(s.reps!=null?s.reps:(s.repetitions||0)))||0;
        return {a:a,b:b,tag:s.tag||s.set_type||'N',done:s.done!==false};
      });
    }
    function exOf(e){
      var name=e.name||e.exercise_name||e.title||e.exercise||'未命名动作';
      var lib=LIB_BY_NAME[name]||{muscle:e.muscle||'chest',eq:e.eq||e.equipment||'dumbbell',mode:'strength',la:'kg',lb:'次',sa:2.5,sb:1,volume:true};
      return {id:uid(),name:name,muscle:e.muscle||lib.muscle,eq:e.eq||lib.eq,mode:lib.mode||'strength',
        la:lib.la,lb:lib.lb,bu:lib.bu,sa:lib.sa,sb:lib.sb,volume:lib.volume!==false,note:'',ghostDate:null,ghost:null,sets:setsOf(e)};
    }
    function sesOf(s,i){
      var d=(s.date||s.start_time||s.startTime||s.day||dstr()).slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=dadd(dstr(),-(i||0));
      var exs=(s.exercises||s.workout_exercises||s.entries||[]).map(exOf);
      return {id:s.id||uid(),date:d,split:s.split||'ppl',node:s.node||s.split_node||'push',
        feeling:s.feeling||null,startedAt:s.startedAt||Date.now(),endedAt:s.endedAt||Date.now(),
        durationMin:Number(s.durationMin||s.duration_minutes||s.duration||45)||45,exercises:exs,note:s.note||''};
    }
    if(obj&&obj.settings&&Array.isArray(obj.sessions)){ // 完整 IronLog 备份
      return {full:obj,sessions:obj.sessions};
    }
    var arr=Array.isArray(obj)?obj:(obj.sessions||obj.workouts||obj.history||obj.data||[]);
    if(!Array.isArray(arr))throw new Error('无法识别文件结构（需要 sessions / workouts 数组）');
    return {full:null,sessions:arr.map(sesOf)};
  },
  toCSV:function(){
    var rows=[['date','split','node','exercise','muscle','equipment','set_index','tag','weight_kg','reps','done','volume_kg']];
    this.S().sessions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(s){
      s.exercises.forEach(function(e){e.sets.forEach(function(x,i){
        rows.push([s.date,s.split,s.node,e.name,e.muscle,e.eq,i+1,x.tag,x.a,x.b,x.done?1:0,
          e.volume!==false&&e.mode!=='cardio'?(Number(x.a)*Number(x.b)):0]);
      });});
    });
    return '\uFEFF'+rows.map(function(r){return r.map(function(c){var v=String(c==null?'':c);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
  }
};

/* 独立 HTML 版增强：组间休息到点的系统通知（Web Notifications API）。
   浏览器不支持或未授权时静默降级为原有「震动 + 提示音 + 页面胶囊」，不影响任何主流程。 */
const Notify=(function(){
  var ok=(typeof Notification!=='undefined');
  function on(){try{return Store.data.settings.notify===true;}catch(e){return false;}}
  function state(){return !ok?'unsupported':(Notification.permission==='granted'?'granted':
    (Notification.permission==='denied'?'denied':'default'));}
  function enable(){
    if(!ok)return Promise.resolve('unsupported');
    if(Notification.permission==='granted')return Promise.resolve('granted');
    if(Notification.permission==='denied')return Promise.resolve('denied');
    try{
      var p=Notification.requestPermission();
      return (p&&typeof p.then==='function')?p:Promise.resolve(Notification.permission);
    }catch(e){return Promise.resolve('default');}
  }
  function rest(){
    if(!ok||!on()||Notification.permission!=='granted')return;
    try{
      var n=new Notification('IronLog · 休息结束',{body:'开始下一组！',tag:'ironlog-rest'});
      setTimeout(function(){try{n.close();}catch(e){}},12000);
    }catch(e){}
  }
  return {supported:ok,on:on,state:state,enable:enable,rest:rest};
})();
const Timer={
  left:0,total:0,tick:null,_hide:null,
  start:function(sec){
    clearTimeout(this._hide);this._hide=null;
    this.left=sec||90;this.total=this.left;
    document.getElementById('rest').classList.remove('due');
    this.show();
    var self=this;clearInterval(this.tick);
    this.tick=setInterval(function(){self.left--;if(self.left<=0){self.finish();}else self.show();},1000);
  },
  adjust:function(d){
    if(!this.tick)return;
    this.left=Math.max(1,this.left+d);this.total=Math.max(this.total,this.left);this.show();
  },
  stop:function(){
    clearInterval(this.tick);this.tick=null;clearTimeout(this._hide);this._hide=null;
    var el=document.getElementById('rest');el.classList.add('hidden');el.classList.remove('due');
  },
  finish:function(){
    clearInterval(this.tick);this.tick=null;
    try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}
    try{Notify.rest();}catch(e){}
    try{var C=window.AudioContext||window.webkitAudioContext;if(C){var a=new C(),o=a.createOscillator(),g=a.createGain();
      o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.16,a.currentTime);
      o.start();o.stop(a.currentTime+.22);o.onended=function(){a.close();};}}catch(e){}
    toast('⏱ 休息结束，开始下一组！');
    var el=document.getElementById('rest');el.classList.remove('hidden');el.classList.add('due');
    el.innerHTML='<div class="rest-top"><div class="rest-ring emoji"><div class="rt">⏰</div></div>'+
      '<div class="rest-main"><div class="rest-kicker"><span class="pulse"></span>TIME\'S UP · 休息结束</div>'+
      '<div class="rest-num txt">开始下一组 💪</div>'+
      '<div class="rest-sub">已震动 / 提示音提醒，准备继续训练</div></div></div>'+
      '<div class="rest-btns"><button class="primary" data-act="rest-skip">知道了 ✓</button></div>';
    var self=this;clearTimeout(this._hide);
    this._hide=setTimeout(function(){self.stop();},4000);
  },
  show:function(){
    var el=document.getElementById('rest');el.classList.remove('hidden');el.classList.remove('due');
    var p=this.total?clamp(this.left/this.total*100,0,100):0,
        R=32,C=2*Math.PI*R,off=C*(1-p/100),
        mm=Math.floor(this.left/60),ss=pad(this.left%60),txt=mm+':'+ss;
    if(!el.querySelector('.rest-ring')){
      el.innerHTML='<svg width="0" height="0" style="position:absolute"><defs>'+
        '<linearGradient id="restGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/>'+
        '<stop offset="100%" stop-color="#6EE7B7"/></linearGradient></defs></svg>'+
        '<div class="rest-top"><div class="rest-ring"><svg viewBox="0 0 76 76">'+
        '<circle class="rc-bg" cx="38" cy="38" r="'+R+'" fill="none" stroke-width="6"/>'+
        '<circle class="rc-fg" cx="38" cy="38" r="'+R+'" fill="none" stroke-width="6" '+
        'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
        '</svg><div class="rt">'+txt+'</div></div>'+
        '<div class="rest-main"><div class="rest-kicker"><span class="pulse"></span>REST TIMER · 组间休息</div>'+
        '<div class="rest-num">'+txt+'</div>'+
        '<div class="rest-sub">到点自动震动 + 提示音，提醒你开始下一组</div></div></div>'+
        '<div class="rest-btns"><button data-act="rest-adjust" data-d="-15">−15s</button>'+
        '<button class="primary" data-act="rest-adjust" data-d="30">＋30s</button>'+
        '<button class="skip" data-act="rest-skip">跳过 ⏭</button></div>';
    }else{
      var r=el.querySelector('.rt'),nu=el.querySelector('.rest-num'),fg=el.querySelector('.rc-fg');
      if(r)r.textContent=txt;if(nu)nu.textContent=txt;
      if(fg)fg.setAttribute('stroke-dashoffset',off.toFixed(1));
    }
  }
};

      var dx=ev.changedTouches[0].clientX-swX,dy=ev.changedTouches[0].clientY-swY;
      if(Math.abs(dx)<72||Math.abs(dx)<Math.abs(dy)*1.7||Date.now()-swT>700)return;
      var ids=UI.tabDefs.map(function(t){return t.id;}),i=ids.indexOf(Runtime.tab),j=i+(dx<0?1:-1);
      if(j<0||j>=ids.length)return;
      Runtime.tab=ids[j];UI.render();
      var v=document.getElementById('view');v.classList.remove('fadein');void v.offsetWidth;v.classList.add('fadein');
      buzz(10);
    },{passive:true});
    /* 从弹层抓手/标题栏下拉关闭 */
    var shEl=document.getElementById('sheet'),dY=0,dOK=false;
    shEl.addEventListener('touchstart',function(ev){
      dOK=!!ev.target.closest('.sheet-grab,.sheet-h');
      dY=ev.touches[0].clientY;shEl.style.transition='none';
    },{passive:true});
    shEl.addEventListener('touchmove',function(ev){
      if(!dOK)return;
      var dy=ev.changedTouches[0].clientY-dY;
      if(dy>0)shEl.style.transform='translate(-50%,'+Math.min(dy,300)+'px)';
    },{passive:true});
    shEl.addEventListener('touchend',function(ev){
      if(!dOK)return;
      var dy=ev.changedTouches[0].clientY-dY;
      dOK=false;
      shEl.style.transition='transform .18s ease-out';shEl.style.transform='';
      if(dy>85)UI.closeSheet();
      setTimeout(function(){shEl.style.transition='';},200);
    },{passive:true});
    /* 关闭弹层时清理内联位移 */
    var _close=UI.closeSheet;
    UI.closeSheet=function(){shEl.style.transition='';shEl.style.transform='';_close.call(UI);};
  },
  act:function(a,d,t,ev){
    var s=Store.data,st=s.settings,td=s.today;
    switch(a){
      case 'tab':Runtime.tab=d('tab');UI.render();{var vv=document.getElementById('view');vv.classList.remove('fadein');void vv.offsetWidth;vv.classList.add('fadein');}return;
      case 'sheet-close':UI.closeSheet();return;
      /* --- 分化轮换 --- */
      case 'node':{
        if(d('id')===td.nodeId)return;
        var has=td.exercises.some(function(e){return e.sets.some(function(x){return x.done;});});
        var go=function(){st.cursor=Engine.nodes().findIndex(function(n){return n.id===d('id');});
          s.today=Engine.plan(d('id'));Runtime.collapsed={};saveRender();toast('已切换到 '+Engine.node(d('id')).n);};
        if(has)confirmSheet('切换分化','今日已有打卡记录，切换会重新生成该分化的动作计划，已完成的组将丢失（历史记录不受影响）。',go);
        else go();return;
      }
      case 'split':{
        st.split=d('id');st.cursor=0;replan(Engine.currentNode().id);
        toast('已切换为 '+SPLITS[d('id')].n);return;
      }
      case 'cycle-add':st.customCycle.push(d('id'));replan(Engine.currentNode().id);return;
      case 'cycle-del':if(st.customCycle.length<=1){toast('至少保留 1 个节点');return;}
        st.customCycle.splice(Number(d('i')),1);st.cursor=0;replan(Engine.currentNode().id);return;
      /* --- 体感 / 避让 --- */
      case 'feeling':td.feeling=td.feeling===d('v')?null:d('v');saveRender(true);toast(td.feeling?'体感已记录：'+FEELINGS.filter(function(f){return f.id===td.feeling;})[0].n:'已清除体感');return;
      case 'avoid':{var v=d('v'),i=s.avoid.indexOf(v);if(i>=0)s.avoid.splice(i,1);else s.avoid.push(v);
        s.aiCache.prescription=null;saveRender(true);return;}
      /* --- v1.1 AI 分析范围 --- */
      case 'review-scope':{
        var sc=d('v');Runtime.reviewScope=sc;
        if(sc==='single'&&!Runtime.reviewSessionId){
          var rs=s.sessions.slice().sort(function(a,b){return a.date<b.date?1:-1;})[0];
          Runtime.reviewSessionId=rs?(rs.id||''):'';
        }
        if(sc==='range'&&!Runtime.reviewFrom){Runtime.reviewFrom=dadd(dstr(),-13);Runtime.reviewTo=dstr();}
        s.aiCache.review=null;saveRender(true);toast('分析范围：'+Engine.scopeLabel());return;
      }
      /* --- v1.1 删除某一天训练 --- */
      case 'del-session':{
        var key=d('id'),ses=s.sessions.filter(function(x){return (x.id||(x.date+'|'+x.node))===key;})[0];
        if(!ses){toast('未找到该训练记录');return;}
        confirmSheet('删除这一天的训练',
          '将永久删除 '+ses.date+' 的「'+((NODE_CATALOG[ses.node]||{n:ses.node}).n)+'」训练（'+
          ses.exercises.length+' 个动作 · '+Engine.volumeOf(ses).sets+' 组）。此操作不可撤销，建议先导出 JSON 备份。',
          function(){
            Store.data.sessions=Store.data.sessions.filter(function(x){return (x.id||(x.date+'|'+x.node))!==key;});
            Store.data.aiCache.review=null;Store.data.aiCache.prescription=null;
            saveRender(true);toast('🗑 已删除 '+ses.date+' 的训练记录');
          });return;
      }
      /* --- v1.2 训练模板：保存 / 套用 / 指定日期导入 / 删除 --- */
      case 'tpl-open':UI.templateSheet();return;
      case 'tpl-save-today':{
        if(!s.today||!s.today.exercises.length){toast('当前训练没有动作');return;}
        Runtime.tplSource={label:'今日训练 · '+dstr()};UI.templateSaveSheet();return;
      }
      case 'tpl-save-session':{
        var tplKey=d('id'),tplSes=s.sessions.filter(function(x){return (x.id||(x.date+'|'+x.node))===tplKey;})[0];
        if(!tplSes){toast('未找到该训练记录');return;}
        Runtime.tplSource={sessionId:tplKey,label:tplSes.date+' · '+((NODE_CATALOG[tplSes.node]||{n:tplSes.node}).n)};
        UI.templateSaveSheet();return;
      }
      case 'tpl-save-confirm':{
        var tplName2=(document.getElementById('tplName')||{}).value||'',tplSrc=Runtime.tplSource||{},tplFrom=s.today;
        if(tplSrc.sessionId)tplFrom=s.sessions.filter(function(x){return (x.id||(x.date+'|'+x.node))===tplSrc.sessionId;})[0]||s.today;
        if(!tplFrom||!tplFrom.exercises.length){toast('这次训练没有动作');return;}
        var tplNew=Engine.makeTemplate(tplName2,tplFrom,tplSrc.label||('训练 · '+(tplFrom.date||dstr())));
        s.templates=s.templates||[];s.templates.push(tplNew);
        UI.closeSheet();saveRender(true);toast('✅ 已保存模板「'+tplNew.name+'」');return;
      }
      case 'tpl-apply':{
        var tplItem=(s.templates||[]).filter(function(x){return x.id===d('id');})[0];
        if(!tplItem){toast('模板不存在');return;}
        var tplGo=function(){var tplN=Engine.applyTemplateToToday(tplItem);
          Runtime.collapsed={};Runtime.tab='workout';UI.closeSheet();saveRender();
          toast('📋 已套用「'+tplItem.name+'」· '+tplN+' 个动作');};
        var tplBusy=s.today&&s.today.exercises.some(function(e){return e.sets.some(function(x){return x.done;});});
        if(tplBusy)confirmSheet('套用模板','今日已有打卡记录，套用模板会替换当前训练面板的动作安排（历史记录不受影响）。',tplGo);
        else tplGo();return;
      }
      case 'tpl-date':UI.templateDateSheet(d('id'));return;
      case 'tpl-date-confirm':{
        var tplDateItem=(s.templates||[]).filter(function(x){return x.id===d('id');})[0];
        if(!tplDateItem){toast('模板不存在');return;}
        var tplDateVal=(document.getElementById('tplDate')||{}).value||dstr();
        var tplRes=Engine.applyTemplateToDate(tplDateItem,tplDateVal);
        s.aiCache.review=null;s.aiCache.prescription=null;
        if(tplRes.mode==='today'){Runtime.collapsed={};Runtime.tab='workout';}
        UI.closeSheet();saveRender();
        toast(tplRes.mode==='today'?('📋 已套用「'+tplDateItem.name+'」到今日面板'):
          ('✅ 已把「'+tplDateItem.name+'」写入 '+tplDateVal+(tplRes.replaced?'（覆盖原记录）':' 的训练记录')));return;
      }
      case 'tpl-del':{
        var tplDelId=d('id'),tplDelItem=(s.templates||[]).filter(function(x){return x.id===tplDelId;})[0];
        if(!tplDelItem)return;
        confirmSheet('删除模板','将删除模板「'+tplDelItem.name+'」，已导入的训练记录不受影响。',function(){
          s.templates=s.templates.filter(function(x){return x.id!==tplDelId;});
          saveRender(true);UI.templateSheet();toast('🗑 已删除模板');});return;
      }
      /* --- 打卡 --- */
      case 'step':{
        var e=exById(d('ex')),j=Number(d('i')),f=d('f'),dir=Number(d('d')),set=e.sets[j];
        if(!e||!set)return;var step=f==='a'?e.sa:e.sb;
        set[f]=Math.max(0,Math.round((Number(set[f])+dir*step)*100)/100);set.touched=true;
        UI.patchSet(e,j);Store.save();return;
      }
      case 'tag':{var e2=exById(d('ex')),s2=e2&&e2.sets[Number(d('i'))];
        if(!s2)return;var tags=['N','W','D','F'];s2.tag=tags[(tags.indexOf(s2.tag||'N')+1)%4];UI.patchSet(e2,Number(d('i')));Store.save();return;}
      case 'done':{
        var e3=exById(d('ex')),j3=Number(d('i')),x=e3&&e3.sets[j3];if(!x)return;
        if(x.done){x.done=false;UI.patchSet(e3,j3);Store.save();return;}
        x.done=true;x.touched=true;x.doneAt=Date.now();UI.patchSet(e3,j3);Store.save();
        if(st.restOn)Timer.start(st.rest);
        if(navigator.vibrate)try{navigator.vibrate(18);}catch(er){}
        return;
      }
      case 'delset':{var e4=exById(d('ex')),j4=Number(d('i'));
        if(!e4)return;if(e4.sets.length<=1){toast('至少保留 1 组');return;}
        e4.sets.splice(j4,1);saveRender(true);return;}
      case 'addset':{var e5=exById(d('ex'));if(!e5)return;
        var last=e5.sets[e5.sets.length-1]||{a:e5.sa||2.5,b:8,tag:'N'};
        e5.sets.push({a:last.a,b:last.b,tag:last.tag||'N',done:false,ghost:false,touched:true});saveRender(true);
        toast('已复制上一组数值追加 1 组');return;}
      case 'collapse':{Runtime.collapsed[d('ex')]=!Runtime.collapsed[d('ex')];UI.render(true);return;}
      case 'delex':{var id=d('ex');s.today.exercises=s.today.exercises.filter(function(x){return x.id!==id;});saveRender(true);toast('已移除动作');return;}
      case 'addex-open':Runtime.sheetScope=d('scope')||'fit';Runtime.sheetFilter='all';Runtime.sheetQuery='';UI.addExSheet();return;
      case 'pick-scope':Runtime.sheetScope=d('v');Runtime.sheetFilter='all';Runtime.sheetQuery='';UI.addExSheet();return;
      case 'pick-filter':Runtime.sheetFilter=d('v');UI.addExSheet();return;
      case 'addex-pick':{var lib=Engine.allExercises().filter(function(x){return x.name===d('name');})[0];
        if(!lib)return;s.today.exercises.push(Engine.exFromLib(lib));UI.closeSheet();saveRender(true);toast('已添加 '+lib.name);return;}
      case 'custom-ex-open':UI.customExSheet();return;
      case 'custom-ex-save':{
        var name=(document.getElementById('ceName')||{}).value.trim();if(!name){toast('请填写动作名称');return;}
        var lib={id:'custom_'+uid(),name:name,muscle:document.getElementById('ceMuscle').value,eq:document.getElementById('ceEq').value,
          pinned:false,mode:'strength',da:Number(document.getElementById('ceA').value)||0,db:Number(document.getElementById('ceB').value)||10,
          la:'kg',lb:'次',sa:2.5,sb:1,volume:true,custom:true};
        s.customExercises.push(lib);LIB_BY_NAME[name]=lib;
        s.today.exercises.push(Engine.exFromLib(lib));UI.closeSheet();saveRender(true);toast('✅ 自定义动作已保存并加入今日');return;
      }
      /* --- 一键完成 --- */
      case 'finish':{
        if(!td.exercises.length){toast('先添加动作再打卡');return;}
        td.exercises.forEach(function(e){e.sets.forEach(function(x){if(!x.done){x.done=true;x.touched=true;}});});
        td.finished=true;var ses=Engine.sessionFrom(td,false);
        s.sessions.push(ses);Engine.advance(td.nodeId);
        s.today=Engine.plan(Engine.currentNode().id);
        s.aiCache.review=null;s.aiCache.prescription=null;
        Timer.stop();Store.save();UI.render();UI.summarySheet(ses);return;
      }
      /* --- 休息计时 --- */
      case 'rest-adjust':Timer.adjust(Number(d('d')));return;
      case 'rest-skip':Timer.stop();toast('已跳过休息');return;
      /* --- AI --- */
      case 'ai-review':{
        if(Runtime.reviewBusy)return;Runtime.reviewBusy=true;UI.render(true);
        Engine.aiReview().then(function(r){r.at=new Date().toLocaleString('zh-CN',{hour12:false}).slice(5);
          s.aiCache.review=r;Runtime.reviewBusy=false;Store.save();UI.render(true);toast('复盘已生成');})
          .catch(function(e){Runtime.reviewBusy=false;UI.render(true);toast('AI 请求失败，已回退本地引擎：'+e.message);
            var r=Engine.localReview();r.at='本地回退';s.aiCache.review=r;Store.save();UI.render(true);});return;
      }
      case 'ai-rx':{
        if(Runtime.rxBusy)return;Runtime.rxBusy=true;UI.render(true);
        Engine.aiPrescription().then(function(r){r.next_node_name=Engine.node(r.next_node||Engine.nextNode().id).n;
          s.aiCache.prescription=r;Runtime.rxBusy=false;Store.save();UI.render(true);toast('下一练处方已生成');})
          .catch(function(e){Runtime.rxBusy=false;UI.render(true);toast('AI 请求失败，已回退本地引擎：'+e.message);
            var r=Engine.localPrescription();s.aiCache.prescription=r;Store.save();UI.render(true);});return;
      }
      case 'ai-adopt':{
        var rx=s.aiCache.prescription;if(!rx)return;
        var n=Engine.adopt(rx);Runtime.tab='workout';Runtime.collapsed={};Store.save();UI.render();
        toast('🚀 已载入 '+n+' 个动作，逐组点 ✓ 即可');return;
      }
      case 'ai-test':{
        if(!Runtime.keyPlain){toast('请先填写 API Key');return;}
        toast('正在测试连接…');
        Engine.callAI([{role:'user',content:'只回复两个字：正常'}],false).then(function(txt){
          UI.openSheet('接口测试','<div class="pill green">✓ 连接成功</div><div class="md" style="margin-top:10px">'+esc(txt.slice(0,200))+'</div>');
        }).catch(function(e){UI.openSheet('接口测试','<div class="pill red">✕ 连接失败</div><div class="md" style="margin-top:10px">'+esc(e.message)+'</div>');});return;
      }
      case 'ai-demo':st.ai.demo=!st.ai.demo;saveRender(true);
        toast(st.ai.demo?'已切换为本地智能引擎（免 Key）':(Runtime.keyPlain?'已启用在线 DeepSeek':'未填写 Key，仍走本地引擎'));return;
      /* --- 设置 --- */
      case 'profile':{
        var p=d('id');st.profile=p;
        if(p!=='custom')EQUIPMENT.forEach(function(e){st.equipment[e.id]=p==='home'?!!e.home:!!e.gym;});
        replan(s.today.nodeId);
        toast(p==='custom'?'已保持当前自定义勾选':(p==='home'?'🏠 已切换居家器械预设':'🏢 已切换商业健身房预设'));return;
      }
      case 'toggle-eq':st.equipment[d('id')]=!st.equipment[d('id')];st.profile='custom';
        replan(s.today.nodeId);return;
      case 'rest-toggle':st.restOn=!st.restOn;if(!st.restOn)Timer.stop();saveRender(true);return;
      case 'set-rest':st.rest=Number(d('v'));saveRender(true);toast('组间休息已设为 '+st.rest+'s');return;
      case 'notify-toggle':{
        if(!Notify.supported){toast('当前浏览器不支持系统通知');return;}
        if(st.notify&&Notify.state()==='granted'){st.notify=false;saveRender(true);toast('已关闭系统通知');return;}
        Notify.enable().then(function(r){
          if(r==='granted'){st.notify=true;toast('✅ 休息到点将发送系统通知');}
          else if(r==='denied'){toast('通知权限已被浏览器拒绝，请在站点设置中允许');}
          else{toast('未获得通知权限，仍会震动 + 提示音');}
          saveRender(true);
        });return;
      }
      case 'bw':st.bodyweight=clamp(st.bodyweight+Number(d('d')),30,250);saveRender(true);return;
      /* --- 数据 --- */
      case 'export-json':download('ironlog_backup_'+stamp()+'.json',JSON.stringify(Store.data,null,2));toast('✅ 全量 JSON 备份已导出');return;
      case 'export-csv':download('ironlog_workouts_'+stamp()+'.csv',Engine.toCSV(),'text/csv;charset=utf-8');toast('✅ CSV 已导出');return;
      case 'import-json':
        if(Native.on){Native.pick().then(function(r){App.applyImport(r.text);}).catch(function(e){toast('选择文件失败：'+e.message);});return;}
        document.getElementById('importFile').click();return;
      case 'reset-demo':confirmSheet('恢复示例数据','这会清空当前的全部训练记录、自定义动作与配置，并重新载入 3 条示例训练。建议先导出 JSON 备份。',function(){
        Store.reset();Runtime.keyPlain='';Engine.ensureToday();UI.render();toast('已恢复示例数据');});return;
      case 'clear-all':confirmSheet('清空全部数据','⚠ 将删除本机所有训练日志与配置，且不可撤销！请务必先导出 JSON 备份。',function(){
        var d0=Store.defaults();d0.sessions=[];d0.customExercises=[];
        Store.data=d0;Runtime.keyPlain='';Engine.ensureToday();Store.save();UI.render();toast('已清空全部数据');});return;
    }
  }
};

window.IronLog={Store:Store,Engine:Engine,UI:UI,App:App,LIB:LIB,Runtime:Runtime,Timer:Timer};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){App.boot();});else App.boot();
})();
</script>
